<!DOCTYPE html>
<html>
<head>
  <title>WebRTC Stream</title>
</head>
<body>
  <div id="videosContainer"></div>
  <script>
    const signaling = new WebSocket('ws://129.68.11.4:8000');
    let pc;
    let isOfferSent = false; // 新增：防止重复发送offer

    // 将start函数移动到WebSocket open事件中
    signaling.onopen = () => {
      console.log('WebSocket connected');
      initializePeerConnection();
    };

    // 封装PeerConnection初始化逻辑
    function initializePeerConnection() {
      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });

      // 统一管理事件监听
      pc.onicecandidate = handleICECandidate;
      pc.ontrack = handleTrackEvent;
      pc.oniceconnectionstatechange = logICEState;
      pc.onsignalingstatechange = logSignalingState;

      startNegotiation(); // 开始信令协商
    }

    // 处理ICE候选
    function handleICECandidate(event) {
      if (event.candidate) {
        signaling.send(JSON.stringify({
          type: 'candidate',
          ice: event.candidate
        }));
      }
    }

    // 核心修改点：优化track处理逻辑
    function handleTrackEvent(event) {
      console.log('Received track:', event);
      if (event.track.kind !== 'video') return;

      event.streams.forEach((stream, index) => {
        const streamId = `video_${event.track.id}`;
        const video = getOrCreateVideoElement(streamId);
        
        // 仅在流变化时更新
        if (video.srcObject !== stream) {
          video.srcObject = stream;
          // 等待元数据加载完成
          video.onloadedmetadata = () => {
            safePlayVideo(video);
          };
        } else {
          safePlayVideo(video);
        }
      });
    }

    // 创建/获取video元素的工具函数
    function getOrCreateVideoElement(streamId) {
      const container = document.getElementById('videosContainer');
      let video = document.getElementById(`video_${streamId}`);
      
      if (!video) {
        video = document.createElement('video');
        video.id = `video_${streamId}`;
        video.autoplay = true;  // 保持自动播放
        video.playsinline = true;
        video.muted = true;
        video.style.width = '30%';  // 让两个视频并排显示
        video.style.margin = '5px';
        video.style.display = 'inline-block';
        container.appendChild(video);
      }
      return video;
    }

    // 安全播放视频（带错误处理）
    function safePlayVideo(video) {
      if (video.paused) {
        video.play()
          .catch(err => {
            // 忽略AbortError（代码1）
            if (err.name !== 'AbortError') {
              console.error('播放错误:', err);
            }
          });
      }
    }

    // 信令协商
    async function startNegotiation() {
      try {
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.addTransceiver('video', { direction: 'recvonly' });
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        // 防重发机制（代码2）
        if (!isOfferSent && signaling.readyState === WebSocket.OPEN) {
          signaling.send(JSON.stringify({ 
            type: 'offer', 
            sdp: pc.localDescription.sdp 
          }));
          isOfferSent = true;
        }
      } catch (err) {
        console.error('协商失败:', err);
      }
    }

    // 其他辅助函数
    function logICEState() {
      console.log('ICE connection state:', pc.iceConnectionState);
    }

    function logSignalingState() {
      console.log('Signaling state:', pc.signalingState);
    }

    // 消息处理
    signaling.onmessage = async (event) => {
      const data = JSON.parse(event.data);
      if (!pc) return;

      try {
        if (data.type === 'answer') {
          await pc.setRemoteDescription(new RTCSessionDescription(data));
        } else if (data.type === 'candidate') {
          await pc.addIceCandidate(new RTCIceCandidate(data.ice));
        }
      } catch (err) {
        console.error('信令处理错误:', err);
      }
    };

    // 初始化时清理旧连接（代码3）
    window.addEventListener('beforeunload', () => {
      if (pc) {
        pc.close();
        pc = null;
      }
      signaling.close();
    });
  </script>
</body>
</html>
